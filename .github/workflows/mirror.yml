name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  mirror:
    name: Push to GitLab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Push ref
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git remote add mirror "https://oauth2:${GITLAB_TOKEN}@gitlab.com/hollali/hwe.git"
          git push mirror "HEAD:${GITHUB_REF}"
          git push mirror --tags
