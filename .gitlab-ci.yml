stages:
  - check
  - build
  - release

default:
  image: rust:1
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - target/
      - .cargo/

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always

check:
  stage: check
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace --locked
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:release:
  stage: build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl
  script:
    - cargo build --release --locked -p hwe
    - mkdir -p dist
    - cp target/release/fm "dist/fm-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu"
    - cd dist
    - sha256sum fm-* > SHA256SUMS
    - |
      for file in *; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hwe/$CI_COMMIT_TAG/$file"
      done
  artifacts:
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build:release"]
  script:
    - echo "Creating GitLab release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "fm $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "fm (Linux x86_64)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hwe/$CI_COMMIT_TAG/fm-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu"
        - name: "SHA256SUMS"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hwe/$CI_COMMIT_TAG/SHA256SUMS"
  rules:
    - if: $CI_COMMIT_TAG
